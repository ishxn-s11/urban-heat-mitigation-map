name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Ruff
        working-directory: backend
        run: ruff check app
      - name: Black
        working-directory: backend
        run: black --check app || true
      - name: Tests
        working-directory: backend
        run: pytest -q
        env:
          DEMO_MODE: "true"
          DATA_MODE: "test"
      - name: OpenAPI contract drift check
        working-directory: backend
        run: |
          python -c "import json; from app.main import app; json.dump(app.openapi(), open('/tmp/openapi.check.json','w'), indent=2)"
          diff /tmp/openapi.check.json ../frontend/openapi.json \
            || (echo "::error::frontend/openapi.json is stale — regenerate: python -c dump from app.main:app, commit the result" && exit 1)
        env:
          DEMO_MODE: "true"
          DATA_MODE: "test"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_DEMO_MODE: "true"

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t urbanflux-backend ./backend
      - name: Build frontend image
        run: docker build -f docker/frontend.Dockerfile -t urbanflux-frontend ./frontend
      - name: Never deploy unconfigured secrets
        run: echo "Images built; deployment is manual and out of CI scope."
