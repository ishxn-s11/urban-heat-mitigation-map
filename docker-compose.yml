name: urbanflux

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: urbanflux
      POSTGRES_PASSWORD: urbanflux
      POSTGRES_DB: urbanflux
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanflux"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DEMO_MODE: "true"
      DATA_MODE: "test"
      DATABASE_URL: postgresql+psycopg://urbanflux:urbanflux@postgres:5432/urbanflux
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173,http://localhost:4173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["rqworker", "urbanflux", "--url", "redis://redis:6379/0"]
    environment:
      DEMO_MODE: "true"
      DATA_MODE: "test"
      DATABASE_URL: postgresql+psycopg://urbanflux:urbanflux@postgres:5432/urbanflux
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_DEMO_MODE: "false"
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
